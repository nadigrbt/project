<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Краскопистолет SATA HRS с нижним бачком</title>
  <meta name="description" content="Краскопистолет SATA HRS с нижним бачком.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" id="header">
    <a class="logo" href="#">лого</a>
    <nav class="site-nav" aria-label="Основная навигация">
      <ul>
        <li><a href="#">Корзина</a></li>
        <li><a href="#">О Нас</a></li>
        <li><a href="#">Вкладка обратной связи</a></li>
        <li><a href="#">Контакты</a></li>
        <li><a href="#catalog">Каталог</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Tall scroll area. The carousel stays pinned inside it while the page scrolls,
         and the scroll position decides which card is in the centre. -->
    <div class="track" id="catalog">
      <section class="carousel" id="carousel" aria-label="Каталог">
        <div class="stage" id="stage" tabindex="0" aria-roledescription="carousel"></div>

        <div class="caption" aria-live="polite">
          <h2 id="name"></h2>
          <p id="role"></p>
          <p id="tagline"></p>
        </div>

        <div class="controls">
          <button type="button" id="prev" aria-label="Previous">&larr;</button>
          <button type="button" id="next" aria-label="Next">&rarr;</button>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
