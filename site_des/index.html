<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Портфолио эффектов для сайтов</title>
<meta name="description" content="31 веб-эффект: анимация текста, скролл-эффекты, курсоры, шейдеры, WebGL и интерактив для сайтов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--card:#171310;--line:rgba(242,238,228,.1);--ink:#F2EEE4;--mute:#9a9083;--lime:#CCFF14;--orange:#D97757;
  --GM:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--ON:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ON);-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.4px);background-size:30px 30px;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%);mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
a{color:inherit}
.wrap{position:relative;max-width:1400px;margin:0 auto;padding:0 32px}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0;font:500 14px/1.2 var(--GM);color:var(--mute);letter-spacing:.02em}
.top b{color:var(--ink);font-weight:500}
.hero{padding:70px 0 40px}
.hero h1{margin:0;font:500 clamp(40px,7vw,96px)/1.02 var(--GM);letter-spacing:-.06em}
.hero h1 .l2{display:flex;align-items:center;flex-wrap:wrap;gap:.25em}
.pill{display:inline-flex;align-items:center;background:var(--lime);color:#141416;border-radius:.24em;padding:.06em .28em .1em;font-size:.62em;letter-spacing:-.04em;transform:rotate(-3deg)}

/* оглавление */
.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 18px;margin:30px 0 90px;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.idx a{display:flex;gap:12px;text-decoration:none;font:400 15px/1.3 var(--GM);letter-spacing:-.03em;color:#cfc6b9;padding:6px 0}
.idx a span{color:var(--lime);min-width:2ch}
.idx a:hover{color:var(--ink)}

/* эффекты: по 2 экрана в ряд */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px;align-items:start}
.fx{padding:0 0 90px;scroll-margin-top:24px}
.win{background:#1d1b19;border-radius:22px;padding:0 8px 8px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07)}
.bar{position:relative;height:44px;display:flex;align-items:center;gap:8px;padding-left:12px}
.bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.bar i:nth-child(2){background:#FEBC2E}
.bar i:nth-child(3){background:#28C840}
.bar u{position:absolute;left:50%;transform:translateX(-50%);text-decoration:none;font:500 13px/1 var(--ON);color:#d9d2c8;background:#2c2926;border-radius:9px;padding:7px 16px;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.win video{display:block;width:100%;aspect-ratio:904/744;border-radius:14px;background:#000;object-fit:cover}
.num{margin-top:26px;font:500 15px/1 var(--GM);color:var(--mute);display:flex;align-items:center;gap:12px}
.num b{font:500 56px/1 var(--GM);letter-spacing:-.06em;color:var(--lime)}
.fx h2{margin:18px 0 8px;font:500 40px/1.08 var(--GM);letter-spacing:-.05em}
.en{font:400 17px/1.3 var(--ON);color:var(--mute)}

footer{border-top:1px solid var(--line);padding:40px 0 60px;font:500 14px/1.6 var(--GM);color:var(--mute);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media (max-width:900px){.list{grid-template-columns:1fr}.idx{grid-template-columns:1fr 1fr}.fx h2{font-size:32px}}
@media (max-width:520px){.wrap{padding:0 18px}.idx{grid-template-columns:1fr}.hero{padding-top:44px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b>31 эффект</b> для сайтов</span><span>Портфолио эффектов</span></div>
  <section class="hero">
    <h1>Эффекты<br><span class="l2">для вашего сайта <span class="pill">портфолио</span></span></h1>
  </section>
  <nav class="idx" id="idx" aria-label="Список эффектов"></nav>
  <main class="list" id="list"></main>
  <footer><span>31 эффект</span><span>Портфолио эффектов для сайтов</span></footer>
</div>

<script>
/* название, английское название */
const FX=[
 ['Появление текста по буквам','Split text reveal'],
 ['Заливка текста при скролле','Scroll-driven text fill'],
 ['Карточки стопкой','Sticky stacked cards'],
 ['Горизонтальный скролл','Horizontal scroll section'],
 ['Параллакс','Layered parallax'],
 ['Влёт в картинку','Scroll zoom into image'],
 ['Проявление через маску','Mask reveal'],
 ['Переход фигурным срезом','Shaped clip-path transition'],
 ['Магнитные кнопки','Magnetic buttons'],
 ['Инвертирующий курсор','Blend-mode cursor'],
 ['Шлейф из картинок за курсором','Image trail'],
 ['Превью при наведении','Hover image preview'],
 ['Бегущая строка с ускорением','Velocity marquee'],
 ['Живой шрифт','Variable font interaction'],
 ['Жидкий градиент','Liquid gradient shader'],
 ['3D-объект на скролле','Scroll-driven 3D model'],
 ['Частицы в логотип','Particle morph'],
 ['Дизеринг','Ordered dithering'],
 ['ASCII-эффект','ASCII renderer'],
 ['Эффект стекла','Glass refraction'],
 ['Переходы между страницами','Page transitions'],
 ['Видео на скролле','Scroll-scrubbed video'],
 ['Секции на весь экран','Fullscreen scroll snap'],
 ['Галерея с инерцией','Draggable inertia gallery'],
 ['Раскрытие на весь экран','FLIP expand'],
 ['Расшифровка текста','Text scramble'],
 ['Отрисовка линий','SVG line drawing'],
 ['Подсветка за курсором','Spotlight cards'],
 ['Искажение картинок на WebGL','WebGL image distortion'],
 ['Счётчик цифр','Animated number counter'],
 ['Прелоадер','Preloader with counter']
];
/* превью эффектов лежат на сайте гайда */
const MEDIA='https://wow.sverh.ai/effects-guide/media/';
const pad=n=>String(n).padStart(2,'0');
const idx=document.getElementById('idx'),list=document.getElementById('list');
FX.forEach(([ru,en],i)=>{
  const n=pad(i+1);
  idx.insertAdjacentHTML('beforeend',`<a href="#e${n}"><span>${n}</span>${ru}</a>`);
  list.insertAdjacentHTML('beforeend',`<article class="fx" id="e${n}">
    <div class="win"><div class="bar"><i></i><i></i><i></i><u>${en}</u></div>
      <video src="${MEDIA}${n}.mp4" poster="${MEDIA}${n}.jpg" muted loop playsinline preload="none" aria-label="${ru}"></video></div>
    <div class="num"><b>${n}</b>/ ${FX.length}</div>
    <h2>${ru}</h2><div class="en">${en}</div>
  </article>`);
});

/* видео играет, только пока оно на экране */
const vids=[...document.querySelectorAll('video')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  const near=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target.preload!=='auto'){e.target.preload='auto'}}),{rootMargin:'600px 0px'});
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target;
    if(e.isIntersecting){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause();
  }),{threshold:.35});
  vids.forEach(v=>{near.observe(v);io.observe(v)});
}
</script>
</body>
</html>
