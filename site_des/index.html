<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Портфолио эффектов для сайтов</title>
<meta name="description" content="31 веб-эффект: анимация текста, скролл-эффекты, курсоры, шейдеры, WebGL и интерактив для сайтов.">
<style>
@font-face{font-family:SG;font-weight:500;font-display:swap;src:url(fonts/SongerGrotesque-Medium.woff) format('woff')}
@font-face{font-family:SG;font-weight:800;font-display:swap;src:url(fonts/SongerGrotesque-ExtraBold.woff) format('woff')}
:root{--bg:#0d0a08;--card:#171310;--line:rgba(242,238,228,.1);--ink:#F2EEE4;--white:#fff;--mute:#9a9083;--lime:#CCFF14;--orange:#D97757;--F:SG,system-ui,sans-serif;--S:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--F);font-weight:500;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{position:relative;max-width:1400px;margin:0 auto;padding:0 32px}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0;font:400 14px/1.2 var(--S);color:var(--mute);letter-spacing:.01em}
.top b{color:var(--white);font-weight:600}
.me{display:flex;align-items:center;gap:14px;text-align:right;max-width:440px}
.me img{flex:none;order:2;width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.me p{margin:0 0 6px;color:#cfc6b9;font-size:13.5px;line-height:1.4}
.links{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.links a{color:var(--white);text-decoration:none;font-weight:500;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:1px}
.links a:hover{border-bottom-color:var(--white)}
.hero{padding:90px 0 190px}
.hero h1{margin:0;font:800 clamp(46px,8vw,116px)/.98 var(--F);letter-spacing:-.02em}


/* эффекты: по 2 экрана в ряд */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px;align-items:start}
.fx{padding:0 0 90px;scroll-margin-top:24px}
.win{background:#1d1b19;border-radius:22px;padding:0 8px 8px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07)}

/* панель вкладок, как в браузере на макбуке */
.bar{display:flex;align-items:flex-end;gap:14px;height:46px;padding:0 6px 0 12px}
.dots{display:flex;gap:8px;align-items:center;height:100%;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.dots i:nth-child(2){background:#FEBC2E}
.dots i:nth-child(3){background:#28C840}
.tabs{display:flex;flex:1;min-width:0;align-items:center;height:100%;padding:7px 0 5px;gap:2px}
.tab{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0;max-width:170px;height:100%;padding:0 8px 0 10px;border-radius:9px;color:#8d857a;font:400 13px/1 var(--S);white-space:nowrap}
.tab+.tab:before{content:'';position:absolute;left:-1px;top:26%;bottom:26%;width:1px;background:rgba(255,255,255,.1)}
.tab.on{flex:1.9 1 0;max-width:260px;background:#2c2926;color:#f2eee4;font-weight:500}
.tab.on:before,.tab.on+.tab:before{display:none}
.fav{flex:none;width:13px;height:13px;border-radius:4px;background:var(--c,#777)}
.tab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab em{flex:none;font-style:normal;font-size:15px;line-height:1;opacity:.55;margin-top:-1px}
.tab.on em{opacity:.8}
.plus{flex:none;align-self:center;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#8d857a;font:300 20px/1 var(--S);margin-left:4px;padding-bottom:2px}
.win video{display:block;width:100%;aspect-ratio:904/744;border-radius:14px;background:#000;object-fit:cover}

.head{margin:0 0 22px}
.num{font:400 14px/1 var(--S);color:var(--mute);display:flex;align-items:baseline;gap:12px}
.num b{font:800 72px/.9 var(--F);letter-spacing:-.02em;color:var(--white)}
.fx h2{margin:14px 0 8px;font:800 46px/1.02 var(--F);letter-spacing:-.015em;color:var(--white)}
.en{font:400 17px/1.3 var(--S);color:var(--mute)}

footer{border-top:1px solid var(--line);padding:40px 0 60px;font:400 14px/1.6 var(--S);color:var(--mute);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media (max-width:900px){.list{grid-template-columns:1fr}.fx h2{font-size:38px}}
@media (max-width:700px){.top{align-items:flex-start;flex-direction:column;gap:20px}.me{text-align:left;max-width:none}.me img{order:0}.links{justify-content:flex-start}}
@media (max-width:520px){.wrap{padding:0 18px}.hero{padding-top:44px}.tab:nth-child(n+4){display:none}.bar{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Примеры эффектов</b>
    <div class="me"><div><p>Делаю сайты с анимацией и интерактивными эффектами. Напишите — обсудим ваш проект.</p>
      <div class="links"><a href="https://t.me/nadigrb" target="_blank" rel="noopener">Telegram @nadigrb</a><a href="https://nadigrb.ru/me" target="_blank" rel="noopener">Моё портфолио</a></div></div>
      <img src="avatar.jpg" alt="Фото автора" width="52" height="52"></div></div>
  <section class="hero">
    <h1>Эффекты<br>для вашего сайта</h1>
  </section>
  <main class="list" id="list"></main>
  <footer><span>Примеры эффектов</span><span><a href="https://t.me/nadigrb" target="_blank" rel="noopener">@nadigrb</a></span></footer>
</div>

<script>
/* название, английское название */
const FX=[
 ['Появление текста по буквам','Split text reveal'],
 ['Заливка текста при скролле','Scroll-driven text fill'],
 ['Карточки стопкой','Sticky stacked cards'],
 ['Горизонтальный скролл','Horizontal scroll section'],
 ['Параллакс','Layered parallax'],
 ['Влёт в картинку','Scroll zoom into image'],
 ['Проявление через маску','Mask reveal'],
 ['Переход фигурным срезом','Shaped clip-path transition'],
 ['Магнитные кнопки','Magnetic buttons'],
 ['Инвертирующий курсор','Blend-mode cursor'],
 ['Шлейф из картинок за курсором','Image trail'],
 ['Превью при наведении','Hover image preview'],
 ['Бегущая строка с ускорением','Velocity marquee'],
 ['Живой шрифт','Variable font interaction'],
 ['Жидкий градиент','Liquid gradient shader'],
 ['3D-объект на скролле','Scroll-driven 3D model'],
 ['Частицы в логотип','Particle morph'],
 ['Дизеринг','Ordered dithering'],
 ['ASCII-эффект','ASCII renderer'],
 ['Эффект стекла','Glass refraction'],
 ['Переходы между страницами','Page transitions'],
 ['Видео на скролле','Scroll-scrubbed video'],
 ['Секции на весь экран','Fullscreen scroll snap'],
 ['Галерея с инерцией','Draggable inertia gallery'],
 ['Раскрытие на весь экран','FLIP expand'],
 ['Расшифровка текста','Text scramble'],
 ['Отрисовка линий','SVG line drawing'],
 ['Подсветка за курсором','Spotlight cards'],
 ['Искажение картинок на WebGL','WebGL image distortion'],
 ['Счётчик цифр','Animated number counter'],
 ['Прелоадер','Preloader with counter']
];
/* превью эффектов лежат на сайте гайда */
const MEDIA='https://wow.sverh.ai/effects-guide/media/';
const pad=n=>String(n).padStart(2,'0');
const COL=['#FF5B2E','#7AA7FF','#C8A8FF','#FFB26B','#5BD6A3','#FF8FB1','#E8D44D','#6FD0FF'];
const list=document.getElementById('list');

/* вкладки: активная (текущий эффект) + следующие по списку */
const tabs=i=>{
  let h='';
  for(let k=0;k<4;k++){
    const j=(i+k)%FX.length;
    h+=`<div class="tab${k?'':' on'}"><i class="fav" style="--c:${COL[j%COL.length]}"></i><span>${FX[j][1]}</span><em>×</em></div>`;
  }
  return h+'<div class="plus">+</div>';
};

FX.forEach(([ru,en],i)=>{
  const n=pad(i+1);
  list.insertAdjacentHTML('beforeend',`<article class="fx" id="e${n}">
    <div class="head"><div class="num"><b>${n}</b>/ ${FX.length}</div><h2>${ru}</h2><div class="en">${en}</div></div>
    <div class="win"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="tabs">${tabs(i)}</div></div>
      <video src="${MEDIA}${n}.mp4" poster="${MEDIA}${n}.jpg" muted loop playsinline preload="none" aria-label="${ru}"></video></div>
  </article>`);
});

/* видео играет, только пока оно на экране */
const vids=[...document.querySelectorAll('video')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  const near=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target.preload!=='auto'){e.target.preload='auto'}}),{rootMargin:'600px 0px'});
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target;
    if(e.isIntersecting){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause();
  }),{threshold:.35});
  vids.forEach(v=>{near.observe(v);io.observe(v)});
}
</script>
</body>
</html>
