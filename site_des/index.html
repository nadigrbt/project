<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Портфолио веб-эффектов</title>
<meta name="description" content="31 веб-эффект: анимации текста, скролл-эффекты, курсоры, шейдеры, WebGL и интерактив для сайтов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;800&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--fg:#f2efe8;--mut:#8d8a82;--lime:#c8ff3d;--orange:#ff5b2e;--cream:#efe9dc;--ink:#121212;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
header{max-width:1480px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(18px,4vw,48px) clamp(20px,3vw,40px);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
h1{font:400 clamp(40px,9vw,128px)/.92 'Archivo Black',Impact,sans-serif;letter-spacing:-.02em}
h1 span{color:var(--lime)}
.count{font:500 13px 'JetBrains Mono',monospace;color:var(--mut);text-align:right;white-space:nowrap}
.count b{display:block;font:400 clamp(32px,5vw,64px)/1 'Archivo Black',Impact,sans-serif;color:var(--fg);margin-bottom:6px}
main{max-width:1480px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(18px,4vw,48px) 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:44px 26px}
.card{min-width:0}
.demo{position:relative;overflow:hidden;aspect-ratio:16/10;border-radius:16px;container-type:size;isolation:isolate;background:#161618;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px var(--line)}
.meta{display:flex;gap:14px;align-items:baseline;padding:14px 2px 0}
.num{font:500 12px 'JetBrains Mono',monospace;color:var(--lime);flex:none}
.meta h3{font:600 18px/1.25 'Manrope',sans-serif;letter-spacing:-.01em}
.meta p{font:400 12.5px 'JetBrains Mono',monospace;color:var(--mut);margin-top:4px}
footer{max-width:1480px;margin:0 auto;padding:0 clamp(18px,4vw,48px) 48px;color:var(--mut);font:400 12px 'JetBrains Mono',monospace}

/* ---------- общие ---------- */
.abs{position:absolute;inset:0}
.demo canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.demo svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 01 split text */
.d1{position:absolute;inset:0;display:grid;place-content:center;padding:0 8cqw;font:400 11.5cqw/1.02 'Archivo Black',Impact,sans-serif;color:var(--ink);letter-spacing:-.01em}
.d1 .ln{display:block;overflow:hidden;padding:.06em 0}
.d1 .ln:last-child{color:var(--orange)}
.d1 i{display:inline-block;font-style:normal;transform:translateY(118%) rotate(8deg);transform-origin:0 100%}
.d1.on i{transform:none;transition:transform .6s cubic-bezier(.215,.61,.355,1);transition-delay:calc(var(--i)*30ms)}
/* 02 text fill */
.d2{position:absolute;inset:0;padding:7cqw 8cqw;display:flex;align-items:center;font:600 7.6cqw/1.12 'Manrope',sans-serif;letter-spacing:-.02em;color:var(--fg)}
.d2 span.acc{color:var(--lime)}
.d2 .cap{display:inline-block;width:11cqw;height:5.6cqw;border-radius:999px;vertical-align:middle;margin:0 .6cqw;background:linear-gradient(120deg,var(--orange),#ffb26b)}
/* 03 stacked cards */
.sc{position:absolute;left:5cqw;right:5cqw;top:0;height:64%;border-radius:14px;padding:4cqw;display:flex;flex-direction:column;justify-content:space-between;transform-origin:50% 0;will-change:transform}
.sc span{font:500 3.2cqw 'JetBrains Mono',monospace}
.sc b{font:800 7.5cqw/1 'Manrope',sans-serif;letter-spacing:-.02em}
.sc em{position:absolute;right:4cqw;top:4cqw;bottom:4cqw;width:30cqw;border-radius:10px;background:rgba(0,0,0,.14)}
/* 04 horizontal */
.hrow{position:absolute;left:0;top:19%;bottom:15%;display:flex;gap:3cqw;padding:0 4cqw;will-change:transform}
.hc{position:relative;flex:none;width:56cqw;border-radius:12px;overflow:hidden}
.hc i{position:absolute;top:0;bottom:0;left:-12%;width:124%;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.55),transparent 45%),linear-gradient(160deg,rgba(255,255,255,.1),rgba(0,0,0,.25))}
.hc span{position:absolute;left:3cqw;bottom:2.4cqw;font:800 8cqw/1 'Manrope';color:rgba(0,0,0,.75)}
.hcount{position:absolute;left:4cqw;top:5cqw;font:500 3.4cqw 'JetBrains Mono',monospace;color:var(--mut)}
.hcount b{color:var(--fg);font-weight:500}
.hbar{position:absolute;left:4cqw;right:4cqw;bottom:6cqw;height:2px;background:rgba(255,255,255,.14)}
.hbar i{display:block;height:100%;background:var(--lime);width:0}
/* 06 zoom */
.d6w{position:absolute;top:50%;font:400 9cqw/1 'Archivo Black',Impact;white-space:nowrap;transform:translateY(-50%)}
.d6img{position:absolute;inset:0;background:radial-gradient(circle at 68% 34%,#ffe2a8 0 7%,transparent 7.5%),linear-gradient(165deg,#ff9a5c,#9c3a6e 52%,#1b1034)}
.d6cap{position:absolute;left:5cqw;right:5cqw;bottom:5cqw;display:flex;justify-content:space-between;font:600 3.6cqw 'Manrope';color:#fff;opacity:0}
/* 09 magnetic */
.mbtn{position:absolute;left:50%;top:50%;width:38cqw;height:13cqw;margin:-6.5cqw 0 0 -19cqw;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;overflow:hidden;font:600 4cqw 'Manrope';color:var(--fg);will-change:transform}
.mbtn::before{content:"";position:absolute;inset:0;background:var(--lime);transform:translateY(101%);transition:transform .4s cubic-bezier(.2,.7,.2,1);border-radius:inherit}
.mbtn.act{color:var(--ink)}.mbtn.act::before{transform:none}
.mbtn span{position:relative;display:block;will-change:transform}
.vdot{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
/* 10 blend cursor */
.d10t{position:absolute;inset:0;display:grid;place-content:center;font:400 19cqw/.92 'Archivo Black',Impact;color:var(--ink);text-align:center;letter-spacing:-.02em}
.d10c{position:absolute;left:0;top:0;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;width:24px;height:24px}
/* 11 trail */
.tr{position:absolute;left:0;top:0;width:19cqw;height:25cqw;border-radius:8px;opacity:0;will-change:transform}
.d11t{position:absolute;inset:0;display:grid;place-content:center;font:600 4cqw 'JetBrains Mono';color:rgba(255,255,255,.35);letter-spacing:.2em;text-transform:uppercase}
/* 12 hover preview */
.d12l{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 6cqw}
.d12r{display:grid;grid-template-columns:5cqw 1fr 18cqw 8cqw;align-items:center;padding:2.4cqw 0;border-bottom:1px solid rgba(255,255,255,.12);font:600 5.2cqw 'Manrope';letter-spacing:-.02em;transition:opacity .3s}
.d12r small{font:400 2.8cqw 'JetBrains Mono';color:var(--mut)}
.pv{position:absolute;left:0;top:0;width:34cqw;height:22cqw;border-radius:8px;pointer-events:none;will-change:transform;z-index:3}
/* 13 marquee */
.d13{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1cqw;overflow:hidden}
.mq{white-space:nowrap;font:400 17cqw/1 'Archivo Black',Impact;letter-spacing:-.01em;will-change:transform}
.mq.o{color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.mq.l{color:var(--lime)}
/* 14 variable font */
.d14{position:absolute;inset:0;display:grid;place-content:center;gap:5cqw;font-family:'Roboto Flex',sans-serif}
.d14h{display:flex;justify-content:center;font-size:13cqw;line-height:1;color:var(--fg);white-space:nowrap}
.d14h i{font-style:normal;display:inline-block}
.ax{display:flex;gap:4cqw;justify-content:center;font:400 2.6cqw 'JetBrains Mono'}
.ax div{width:30cqw}.ax div span{color:var(--mut)}
.ax div u{display:block;height:2px;background:rgba(255,255,255,.15);margin-top:1.2cqw;text-decoration:none}
.ax div u i{display:block;height:100%;background:var(--lime);width:0}
/* 15 liquid */
.d15t{position:absolute;inset:0;display:grid;place-content:center;font:400 12cqw/.95 'Archivo Black',Impact;color:rgba(255,255,255,.92);text-align:center;mix-blend-mode:overlay;pointer-events:none}
/* 16 3d */
.d16{position:absolute;inset:0;perspective:90cqw}
.d16l{position:absolute;left:7cqw;top:50%;transform:translateY(-50%);font:500 3.2cqw/2.2 'JetBrains Mono';color:var(--mut)}
.d16l div{transition:color .3s}.d16l .on{color:var(--lime)}
.obj{--u:1cqw;position:absolute;left:67%;top:50%;width:calc(26*var(--u));height:calc(44*var(--u));margin:calc(-22*var(--u)) 0 0 calc(-13*var(--u));transform-style:preserve-3d;will-change:transform}
.fc{position:absolute;backface-visibility:hidden;border-radius:calc(3*var(--u))}
.fc.f{inset:0;transform:translateZ(calc(2*var(--u)));background:radial-gradient(circle at 30% 20%,#7aa7ff,#3a2c8f 55%,#140f3a);box-shadow:inset 0 0 0 calc(.8*var(--u)) #cfd3dc}
.fc.b{inset:0;transform:rotateY(180deg) translateZ(calc(2*var(--u)));background:linear-gradient(135deg,#e9ebf0,#9ba0ad 50%,#d7dae2)}
.fc.l{width:calc(4*var(--u));height:100%;left:calc(-2*var(--u));transform:rotateY(-90deg);background:linear-gradient(#cfd3dc,#7c818d)}
.fc.r{width:calc(4*var(--u));height:100%;left:calc(24*var(--u));transform:rotateY(90deg);background:linear-gradient(#cfd3dc,#7c818d)}
.fc.t{height:calc(4*var(--u));width:100%;top:calc(-2*var(--u));transform:rotateX(90deg);background:#c4c8d2}
.fc.u{height:calc(4*var(--u));width:100%;top:calc(42*var(--u));transform:rotateX(-90deg);background:#8b909c}
.shd{position:absolute;left:67%;bottom:9%;width:28cqw;height:5cqw;margin-left:-14cqw;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%)}
/* 20 glass */
.gs{position:absolute;overflow:hidden;background:linear-gradient(135deg,#1a1a3e,#4a1f6a)}
.gs i{position:absolute;border-radius:50%}
.gs b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:400 24cqw/1 'Archivo Black',Impact;color:#fff;letter-spacing:-.02em}
.cap{position:absolute;overflow:hidden;border-radius:999px;width:44cqw;height:16cqw;backdrop-filter:blur(1px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -10px 18px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.28),0 14px 34px rgba(0,0,0,.35)}
.cap .cl{position:absolute;filter:saturate(1.35) contrast(1.06)}
.cap::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;background:radial-gradient(120% 90% at 50% -10%,rgba(255,255,255,.55),transparent 45%),radial-gradient(60% 120% at 0% 50%,rgba(255,60,120,.28),transparent 60%),radial-gradient(60% 120% at 100% 50%,rgba(60,160,255,.3),transparent 60%)}
.cap span{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font:700 3.8cqw 'Manrope';color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
/* 21 / 25 fx cards */
.fx{position:absolute;overflow:hidden;transition:left .85s cubic-bezier(.7,0,.2,1),top .85s cubic-bezier(.7,0,.2,1),width .85s cubic-bezier(.7,0,.2,1),height .85s cubic-bezier(.7,0,.2,1),border-radius .85s cubic-bezier(.7,0,.2,1),opacity .5s,transform .6s}
.fx .lb{position:absolute;left:3cqw;bottom:2.4cqw;font:700 3.4cqw 'Manrope';color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3);transition:font-size .85s cubic-bezier(.7,0,.2,1)}
.pg{position:absolute;left:6cqw;right:6cqw;top:61%;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.pg.on{opacity:1;transform:none;transition-delay:.55s}
.pg b{display:block;font:800 6.4cqw 'Manrope';letter-spacing:-.02em;color:var(--fg)}
.pg u{display:block;height:1.4cqw;border-radius:99px;background:rgba(255,255,255,.14);margin-top:2cqw;text-decoration:none}
.pg u:nth-of-type(2){width:70%}
.pg s{display:inline-block;margin-top:3cqw;padding:1.6cqw 4cqw;border-radius:99px;background:var(--lime);color:var(--ink);font:700 3cqw 'Manrope';text-decoration:none}
.dt{position:absolute;left:4cqw;right:4cqw;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;font:600 3.4cqw 'Manrope';color:#fff;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.35);padding-top:1.6cqw}
.fx.open .dt{opacity:1;transform:none}
/* 23 snap */
.sn{position:absolute;inset:0;overflow:hidden}
.ss{height:100%;position:relative;display:grid;align-content:center;padding:0 9cqw}
.ss b{display:block;font:400 11cqw/1 'Archivo Black',Impact;letter-spacing:-.02em;transform:translateY(30px);opacity:0;transition:.7s cubic-bezier(.2,.7,.2,1)}
.ss p{font:500 3.4cqw 'Manrope';margin-top:2.4cqw;opacity:0;transform:translateY(20px);transition:.7s .12s cubic-bezier(.2,.7,.2,1)}
.ss.in b,.ss.in p{opacity:1;transform:none}
.ss i{position:absolute;right:15cqw;top:50%;width:20cqw;height:20cqw;margin-top:-10cqw;border-radius:50%;background:rgba(0,0,0,.14);transform:scale(.4);opacity:0;transition:.8s .1s}
.ss.in i{transform:none;opacity:1}
.dots{position:absolute;right:4cqw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2cqw;z-index:2;transition:color .4s;color:var(--ink)}
.dots i{width:1.5cqw;height:1.5cqw;border-radius:50%;background:currentColor;opacity:.3;transition:.3s}
.dots i.on{opacity:1;transform:scale(1.5)}
.snc{position:absolute;left:5cqw;bottom:4cqw;font:500 3cqw 'JetBrains Mono';z-index:2;transition:color .4s;color:var(--ink)}
/* 24 gallery */
.d24{cursor:grab}
.gstrip{position:absolute;left:0;top:14%;bottom:14%;display:flex;gap:2.4cqw;padding:0 3.5cqw;will-change:transform}
.gc{flex:none;width:34cqw;border-radius:10px;position:relative;overflow:hidden;transform:skewX(var(--sk,0deg))}
.gc span{position:absolute;left:2.4cqw;bottom:2cqw;font:800 7cqw/1 'Manrope';color:rgba(255,255,255,.9)}
.dragc{position:absolute;left:0;top:0;width:16cqw;height:16cqw;margin:-8cqw 0 0 -8cqw;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font:700 3.2cqw 'Manrope';pointer-events:none;opacity:0;z-index:3;transition:opacity .25s}
/* 26 scramble */
.d26{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2.2cqw;padding:0 7cqw;font:500 4.4cqw/1.2 'JetBrains Mono',ui-monospace,monospace;color:var(--lime);white-space:pre}
.d26 div:nth-child(2){color:var(--fg)}.d26 div:nth-child(3){color:var(--mut);font-size:3.4cqw}
/* 27 lines */
.d27p{position:absolute;right:4cqw;top:3.4cqw;font:500 3.6cqw 'JetBrains Mono';color:var(--lime)}
.d27c{position:absolute;left:4cqw;top:3.4cqw;font:500 2.8cqw 'JetBrains Mono';color:var(--mut)}
/* 28 spotlight */
.d28{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2.2cqw;padding:3.5cqw}
.sp{position:relative;border-radius:10px;background:#111114;padding:3cqw;display:flex;flex-direction:column;justify-content:flex-end;--x:-999px;--y:-999px;overflow:hidden}
.sp::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(180px circle at var(--x) var(--y),rgba(200,255,61,.17),transparent 70%)}
.sp::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(150px circle at var(--x) var(--y),rgba(200,255,61,.95),transparent 70%),rgba(255,255,255,.07);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.sp b{position:relative;z-index:1;font:700 3.2cqw 'Manrope'}
.sp small{position:relative;z-index:1;font:400 2.2cqw 'JetBrains Mono';color:var(--mut);margin-top:.8cqw}
.sp i{position:relative;z-index:1;width:4cqw;height:4cqw;border-radius:6px;background:rgba(200,255,61,.18);margin-bottom:auto;display:block}
/* 30 counter */
.d30{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:rgba(255,255,255,.1)}
.st{background:var(--bg);padding:3.6cqw 4.5cqw;display:flex;flex-direction:column;justify-content:space-between}
.st b{font:800 9cqw/1 'Manrope';letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st b small{font-size:.5em;color:var(--lime);margin-left:.15em}
.st span{font:500 2.6cqw 'JetBrains Mono';color:var(--mut)}
.st .bars{display:flex;align-items:flex-end;gap:3px;height:6cqw}
.st .bars i{flex:1;background:var(--lime);opacity:.85;height:0;border-radius:1px}
/* 31 preloader */
.pre{position:absolute;inset:0;z-index:3;background:#0c0c0c;transition:opacity .2s}
.pre b{position:absolute;left:5cqw;bottom:4cqw;font:400 22cqw/.8 'Archivo Black',Impact;font-variant-numeric:tabular-nums;color:var(--fg)}
.pre i{position:absolute;left:50%;top:44%;width:19cqw;height:25cqw;margin:-12.5cqw 0 0 -9.5cqw;border-radius:6px;background:linear-gradient(160deg,#ffb26b,#9c3a6e)}
.pre u{position:absolute;left:5cqw;right:5cqw;top:5cqw;height:2px;background:rgba(255,255,255,.15)}
.pre u s{display:block;height:100%;background:var(--lime);width:0}
.cur{position:absolute;left:0;right:0;height:50.5%;background:#0c0c0c;z-index:2;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.cur.t{top:0}.cur.b{bottom:0}
.cur.t.go{transform:translateY(-101%)}.cur.b.go{transform:translateY(101%)}
.d31h{position:absolute;inset:0;display:grid;place-content:center;background:var(--cream);color:var(--ink);font:400 15cqw/1 'Archivo Black',Impact;letter-spacing:-.02em}
.d31h .ln{display:block;overflow:hidden}
.d31h i{display:inline-block;font-style:normal;transform:translateY(115%)}
.d31h.on i{transform:none;transition:transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*45ms)}
/* d18 d19 chips */
.chips{position:absolute;left:3cqw;bottom:3cqw;display:flex;gap:1.6cqw;z-index:2}
.chips button{font:500 2.6cqw 'JetBrains Mono';color:var(--fg);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:.9cqw 2.4cqw;cursor:pointer}
.chips button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

@media (prefers-reduced-motion:reduce){.fx,.pg,.dt,.ss b,.ss p,.ss i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Веб-<br><span>эффекты</span></h1>
  <div class="count"><b id="cnt">31</b>эффект на странице</div>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>Наведите курсор на карточки: многие эффекты реагируют на мышь.</footer>

<script>
'use strict';
/* ================= утилиты ================= */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tri=x=>1-Math.abs((x%2)-1);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

/* цикл анимации: работает только пока карточка видна */
function loop(el,fn){
  if(reduced){fn(2.4,0);return}
  let vis=false,raf=0,last=0;const t0=performance.now();
  const tick=now=>{if(!vis)return;fn((now-t0)/1000,Math.min(.05,(now-last)/1000||.016));last=now;raf=requestAnimationFrame(tick)};

/* ================= 29 Искажение картинок ================= */
function d29(el){
  el.style.background='#000';const O=mkCanvas(el,1),ctx=O.ctx;let src=null,ch=null,sw=0,sh=0;
  const build=()=>{const W=O.w,H=O.h;sw=W;sh=H;src=document.createElement('canvas');src.width=W;src.height=H;const s=src.getContext('2d');
    s.fillStyle='#efe9dc';s.fillRect(0,0,W,H);const pw=(W-4*W*.03)/3;
    [['#ff9a5c','#9c3a6e'],['#c8ff3d','#1f7a5a'],['#7aa7ff','#2a1f7a']].forEach((c,i)=>{const x=W*.03+i*(pw+W*.03),y=H*.1,hh=H*.8,g=s.createLinearGradient(x,y,x+pw,y+hh);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);s.fillStyle=g;s.fillRect(x,y,pw,hh);
      s.fillStyle='rgba(255,255,255,.85)';s.beginPath();s.arc(x+pw*(.35+.3*i%2),y+hh*.3,pw*.18,0,6.283);s.fill();s.fillStyle='rgba(0,0,0,.28)';s.fillRect(x,y+hh*.62,pw,hh*.38)});
    ch=['#ff0000','#00ff00','#0000ff'].map(col=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='multiply';x.fillStyle=col;x.fillRect(0,0,W,H);return c})};
  const M=track(el);let kick=0;
  loop(el,t=>{const W=O.w,H=O.h;if(!src||sw!==W||sh!==H)build();
    kick=Math.max(kick*.92,Math.min(26,Math.hypot(M.vx,M.vy)*.9));M.vx=M.vy=0;
    const amp=Math.max(18*Math.pow(Math.max(0,Math.sin(t*1.3)),3),kick);
    ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    const sl=3;for(let y=0;y<H;y+=sl){const dx=Math.sin(y*.045+t*3)*amp;
      for(let c=0;c<3;c++)ctx.drawImage(ch[c],0,y,W,sl,dx+(c-1)*amp*.35,y,W,sl)}
    ctx.globalCompositeOperation='source-over'});
}
/* ================= 30 Счётчик цифр ================= */
function d30(el){
  const S=[[12480,0,'','Пользователей'],[98.6,1,'%','Аптайм'],[3.2,1,'GW','Мощность'],[240,0,'+','Проектов']];
  const g=h('div','d30',S.map(s=>`<div class="st"><span>${s[3]}</span><b>0<small>${s[2]}</small></b><div class="bars">${Array.from({length:9},(_, i)=>`<i data-h="${30+((i*37)%70)}"></i>`).join('')}</div></div>`).join(''));el.append(g);
  const cs=[...g.children];
  loop(el,t=>{const m=t%6;cs.forEach((c,i)=>{const p=easeOut(clamp((m-.3-i*.1)/1.8)),s=S[i];
    c.querySelector('b').firstChild.nodeValue=(s[0]*p).toLocaleString('ru-RU',{minimumFractionDigits:s[1],maximumFractionDigits:s[1]});
    c.querySelectorAll('.bars i').forEach((b,k)=>{b.style.height=(b.dataset.h*clamp(p*1.6-k*.08))+'%'})})});
}
/* ================= 31 Прелоадер ================= */
function d31(el){
  el.style.background='#0c0c0c';
  const hero=h('div','d31h');let k=0;hero.innerHTML=`<span class="ln">${[...'MAISON'].map(c=>`<i style="--i:${k++}">${c}</i>`).join('')}</span>`;
  const pre=h('div','pre','<b>000</b><i></i><u><s></s></u>'),ct=h('div','cur t'),cb=h('div','cur b');el.append(hero,pre,ct,cb);
  const num=pre.querySelector('b'),line=pre.querySelector('s');ct.style.cssText+='';
  loop(el,t=>{const m=t%6.4,p=easeOut(clamp((m-.2)/2.5));
    num.textContent=String(Math.round(p*100)).padStart(3,'0');line.style.width=p*100+'%';
    const done=m>2.9,go=m>3.1&&m<6.0;pre.style.opacity=done?0:1;
    ct.style.transition=cb.style.transition=(m>=6.0||m<.1)?'none':'';
    ct.classList.toggle('go',go);cb.classList.toggle('go',go);hero.classList.toggle('on',m>3.5&&m<6.0)});
}
