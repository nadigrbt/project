<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcwave Carousel</title>
  <meta name="description" content="Meet the team: an arc-shaped carousel of team members.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">The team</p>
      <h1>People behind the work</h1>
    </header>

    <section class="carousel" aria-label="Team carousel">
      <div class="stage" id="stage" tabindex="0" aria-roledescription="carousel"></div>

      <div class="caption" aria-live="polite">
        <h2 id="name"></h2>
        <p id="role"></p>
        <p id="tagline"></p>
      </div>

      <div class="controls">
        <button type="button" id="prev" aria-label="Previous">&larr;</button>
        <button type="button" id="next" aria-label="Next">&rarr;</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="https://www.framer.com" target="_blank" rel="noopener">
      Create a free website with Framer, the website builder loved by startups, designers and agencies.
    </a>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
